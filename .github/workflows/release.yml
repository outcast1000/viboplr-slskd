name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Syntax check
        run: node --check index.js

      - name: Run tests
        run: node --test

      - name: Verify the tag matches manifest.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAN=$(node -e 'console.log(require("./manifest.json").version)')
          if [ "$TAG" != "$MAN" ]; then
            echo "tag v$TAG does not match manifest.json version $MAN" >&2
            exit 1
          fi

      - name: Package
        run: scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" slskd.zip update.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
